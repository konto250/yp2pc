services:
  yp2pc:
    build: .
    image: yp2pc:local
    restart: unless-stopped
    init: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      APP_BASE_URL: "${APP_BASE_URL:?APP_BASE_URLを.envに設定してください}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:?管理パスワードのハッシュを.envに設定してください}"
      MEDIA_DIR: /data
      MEDIA_MAX_BYTES: "${MEDIA_MAX_BYTES:-5368709120}"
      MAX_EPISODES: "${MAX_EPISODES:-10}"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3001}:3000"
    volumes:
      - type: bind
        source: "${DATA_DIR:-./data}"
        target: /data
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
